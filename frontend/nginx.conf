# Static SPA server for the built React/Vite app.
# The ALB terminates TLS and routes /api/* to the backend, so this server only
# serves static files and falls back to index.html for client-side routes.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container/ALB health probe — cheap, no logging.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths resolve to index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
